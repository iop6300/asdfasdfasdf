<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI 성과 대시보드</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js" defer></script>
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
<main class="shell">
  <header class="top"><div><div class="brand">TEAM PERFORMANCE</div><h1>KPI 성과 대시보드</h1><p>월별 목표와 실적을 한눈에 확인하세요.</p></div><span class="sample" id="modeBadge">연결 확인 중</span></header>
  <section class="auth-panel panel" id="authPanel" hidden>
    <div class="panel-head"><h2 id="authTitle">Supabase 로그인</h2><span class="hint" id="connectionState"></span></div>
    <form id="authForm" class="auth-form">
      <label class="field"><span>이메일</span><input id="authEmail" type="email" autocomplete="username" required></label>
      <label class="field"><span>비밀번호</span><input id="authPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
    </form>
    <p class="hint" id="authHelp">기존에 발급된 사용자 계정으로 로그인합니다. 이 화면은 계정을 만들지 않습니다.</p>
  </section>
  <section class="toolbar" aria-label="필터 및 작업">
    <label class="field"><span>월</span><select id="monthFilter" aria-label="월 필터"></select></label>
    <label class="field"><span>부서</span><select id="deptFilter" aria-label="부서 필터"></select></label>
    <div class="actions">
      <button id="resetFilter">필터 초기화</button>
      <button id="sampleToggle">샘플 보기</button>
      <button id="dbToggle" hidden>DB 모드</button>
      <button class="primary" id="addToggle">＋ KPI 입력</button>
      <button id="logout" hidden>로그아웃</button>
    </div>
  </section>
  <div id="alert" class="alert" role="status" aria-live="polite" hidden></div>
  <section class="cards" aria-live="polite">
    <article class="card"><div class="label">목표 합계</div><strong id="targetTotal">0원</strong><small>선택 조건 기준</small></article>
    <article class="card"><div class="label">실적 합계</div><strong id="actualTotal">0원</strong><small>선택 조건 기준</small></article>
    <article class="card rate"><div class="label">전체 달성률</div><strong id="achievement">목표 미설정</strong><small>실적 합계 ÷ 목표 합계 × 100</small></article>
  </section>
  <section class="panel chart-panel"><div class="panel-head"><h2>부서별 목표 달성률</h2><span class="hint">현재 월·부서 필터 기준</span></div><div id="chart"></div></section>
  <section class="panel" id="entryPanel" hidden>
    <div class="panel-head"><h2>KPI 항목 입력</h2><span class="hint" id="saveNote"></span></div>
    <form id="entryForm" class="form-grid">
      <label class="field"><span>월</span><input type="month" id="entryMonth" required></label>
      <label class="field"><span>부서</span><input id="entryDept" list="departments" maxlength="40" placeholder="예: 영업팀" required><datalist id="departments"></datalist></label>
      <label class="field"><span>목표 (원)</span><input type="number" id="entryTarget" min="0" max="1000000000000" step="1" placeholder="0" required></label>
      <label class="field"><span>실적 (원)</span><input type="number" id="entryActual" min="0" max="1000000000000" step="1" placeholder="0" required></label>
      <button class="primary submit" type="submit">항목 저장</button>
    </form>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>근거 데이터</h2><span class="hint" id="recordCount">0건</span></div>
    <div class="table-scroll"><table><thead><tr><th>월</th><th>부서</th><th class="num">목표</th><th class="num">실적</th><th class="num">달성률</th><th></th></tr></thead><tbody id="evidenceRows"></tbody></table></div>
  </section>
  <p class="foot" id="modeFootnote"></p>
</main>
</body>
</html>
